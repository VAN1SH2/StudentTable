name: Build and publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_CERT_SHA256: 0d63061ee5510975d5642cc8e0bc5f9375903278e3ad6d05065d3fd5c77f08bd
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'

      - name: Restore the existing APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'The ANDROID_DEBUG_KEYSTORE_BASE64 repository secret is required.' >&2
            exit 1
          fi
          signing_path="$RUNNER_TEMP/studenttable-debug.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_path"
          chmod 600 "$signing_path"
          key_certificate=$(keytool -J-Duser.language=en -J-Duser.country=US -list -v -alias androiddebugkey -keystore "$signing_path" -storepass android | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$key_certificate" != "$EXPECTED_CERT_SHA256" ]; then
            echo 'The restored signing key differs from the existing app.' >&2
            exit 1
          fi
          printf 'STUDENTTABLE_DEBUG_KEYSTORE=%s\n' "$signing_path" >> "$GITHUB_ENV"

      - name: Test and build APK
        run: ./gradlew :core:test :app:assembleDebug --no-daemon --console=plain

      - name: Verify and prepare the download
        id: package
        run: |
          apk='app/build/outputs/apk/debug/app-debug.apk'
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --verbose --print-certs "$apk"
          actual_certificate=$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$actual_certificate" != "$EXPECTED_CERT_SHA256" ]; then
            echo 'APK signature differs from the existing app. Refusing to publish.' >&2
            exit 1
          fi
          version=$(jq -er '.elements[0].versionName' app/build/outputs/apk/debug/output-metadata.json)
          version_code=$(jq -er '.elements[0].versionCode' app/build/outputs/apk/debug/output-metadata.json)
          application_id=$(jq -er '.applicationId' app/build/outputs/apk/debug/output-metadata.json)
          min_sdk=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n "s/^sdkVersion:'\([0-9]*\)'/\1/p")
          apk_name="StudentTable-${version}.apk"
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p dist
          cp "$apk" "dist/$apk_name"
          apk_sha256=$(sha256sum "dist/$apk_name" | cut -d ' ' -f 1)
          apk_size=$(stat -c %s "dist/$apk_name")
          jq -n --arg applicationId "$application_id" --arg versionName "$version" \
            --argjson versionCode "$version_code" --argjson minSdk "$min_sdk" \
            --arg apkUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$apk_name" \
            --arg sha256 "$apk_sha256" --argjson sizeBytes "$apk_size" \
            '{schemaVersion: 1, applicationId: $applicationId, versionCode: $versionCode, versionName: $versionName, minSdk: $minSdk, apkUrl: $apkUrl, sha256: $sha256, sizeBytes: $sizeBytes}' \
            > dist/StudentTable-update.json
          (cd dist && sha256sum "$apk_name" > SHA256SUMS.txt)
          printf 'version=%s\napk_name=%s\n' "$version" "$apk_name" >> "$GITHUB_OUTPUT"
          printf 'Сборка StudentTable %s для Android 8.0 и новее.\n\nСкачайте **%s** из Assets ниже.\n\nКод: `%s`\n' "$version" "$apk_name" "$GITHUB_SHA" > dist/release-notes.md

      - name: Publish the APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.package.outputs.version }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "dist/$APK_NAME" dist/SHA256SUMS.txt dist/StudentTable-update.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "StudentTable $APP_VERSION · сборка $GITHUB_RUN_NUMBER" \
            --notes-file dist/release-notes.md \
            --latest
          printf '### APK готов\n\n[Скачать %s](https://github.com/%s/releases/latest/download/%s)\n' "$APK_NAME" "$GITHUB_REPOSITORY" "$APK_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/studenttable-debug.keystore"
